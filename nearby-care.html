<body class="bg-background font-sans text-on-surface antialiased min-h-screen flex flex-col" data-page="nearby-care">
  <div id="header-placeholder"></div>
  <main class="care-shell">
    <header class="care-intro">
    <h1 data-i18n="care.title">Tìm cơ sở y tế gần bạn</h1>
    <p data-i18n="care.intro">Tìm bệnh viện, trạm y tế và phòng khám quanh vị trí của bạn.</p>
    <div class="care-toolbar">
      <button id="locate" disabled><svg class="care-icon" aria-hidden="true"><use href="assets/icons/care.svg#locate"/></svg><span data-i18n="care.locate">Dùng vị trí hiện tại</span></button>
      <button id="pick" disabled><svg class="care-icon" aria-hidden="true"><use href="assets/icons/care.svg#pin"/></svg><span data-i18n="care.pick">Chọn điểm trên bản đồ</span></button>
    </div>
    </header>
    <div class="care-grid">
      <div id="care-map" tabindex="0" role="region" data-i18n-aria-label="care.map" aria-label="Bản đồ cơ sở y tế"></div>
      <section class="care-panel">
        <h2><svg class="care-icon" aria-hidden="true"><use href="assets/icons/care.svg#hospital"/></svg><span data-i18n="care.results">Cơ sở gần nhất</span></h2>
        <p id="care-status" role="status"></p>
        <ol id="care-list"></ol>
        <div class="care-toolbar">
          <button id="expand" data-i18n="care.expand" hidden>Mở rộng đến 10 km</button>
          <a id="fallback" data-i18n="care.details" target="_blank" rel="noopener noreferrer" hidden>Xem trên Google Maps</a>
          <button id="retry" data-i18n="care.retry" hidden>Thử lại</button>
        </div>
      </section>
    </div>
  </main>
  <div id="footer-placeholder"></div>
